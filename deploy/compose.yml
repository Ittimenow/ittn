name: ittn

services:
  web:
    image: ${ITTN_IMAGE:?Set ITTN_IMAGE to a verified production image}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      IDEA_STORAGE_DIR: /app/data/ideas
      IDEA_TRUST_PROXY: "true"
      IDEA_PUBLIC_ORIGIN: https://ittimenow.com
    env_file:
      - path: ./mail.env
        required: false
    volumes:
      - idea-drawings:/app/data
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  idea-drawings:
